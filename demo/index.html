<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIOF Demo</title><style>body{font:18px system-ui;max-width:850px;margin:4rem auto;padding:0 1rem;background:#08111f;color:#edf5ff}a{color:#67b7ff}.card{padding:2rem;border:1px solid #29405e;border-radius:16px;background:#111d2e}button{padding:.8rem 1rem;border-radius:8px;border:0;background:#4da3ff;font-weight:700}</style></head><body><div class="card"><p>ALLINONEFORENSICS · SYNTHETIC DEMO</p><h1>Evidence to an explainable incident report.</h1><p>Run the live API demo for the full guided dashboard, or read the beginner tutorial.</p><p><a href="https://github.com/abhiiibabariya-dev/AllinOneForensics/blob/main/docs/DEMO.md">Read the tutorial</a></p><button id="listen">Listen to overview</button><p id="status">Browser-local narration; no data is uploaded.</p></div><script>const text='Welcome to the AllinOneForensics demo. Learn how to preserve evidence, parse artifacts, correlate indicators, and report an incident using synthetic data.';const listen=document.getElementById('listen');const status=document.getElementById('status');listen.onclick=()=>{if(!('speechSynthesis'in window)){status.textContent='Your browser does not support narration.';return}speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text));status.textContent='Playing local narration.'}</script></body></html>
