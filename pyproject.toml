[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "allinoneforensics"
version = "0.1.0"
description = "All-in-one authorized DFIR workbench: host, mobile, network, cloud. Offline-first. PDF/DOCX reports."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Abhi Babariya"}]
keywords = ["dfir", "forensics", "incident-response", "digital-forensics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.3",
    "python-docx>=1.1.0",
    "reportlab>=4.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "dpkt>=1.9.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3.0"]
windows = ["python-evtx>=0.7.4"]
memory = ["volatility3>=2.5.0"]
yara = ["yara-python>=4.5.0"]

[project.scripts]
aiof = "aiof.cli:app"

[project.urls]
Homepage = "https://github.com/abhiiibabariya-dev/AllinOneForensics"
Repository = "https://github.com/abhiiibabariya-dev/AllinOneForensics"

[tool.setuptools.packages.find]
include = ["aiof*"]

[tool.setuptools.package-data]
aiof = ["intel/*.json", "reporting/templates/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
